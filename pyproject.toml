[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shsm"
version = "1.0.0"
description = "Server Health & Security Monitoring (SHSM) - read-only CLI monitoring for Ubuntu + CyberPanel + OpenLiteSpeed + WordPress"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "GM Teknologi" }]
dependencies = [
    "click>=8.1,<9",
    "PyYAML>=6.0,<7",
    "psutil>=5.9",
    "requests>=2.31,<3",
    "reportlab>=4.0,<5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-requests",
    "types-psutil",
    "cryptography",
]

[project.scripts]
shsm = "shsm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shsm = ["database/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "linux: test only meaningful on Linux",
]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess is only ever called with argument arrays by design
    "S607",  # partial executable path is intentional (PATH resolution is validated)
    "S110",
    "UP006", "UP007", "UP035", "UP045",
    "E501", "S104", "S105", "S108", "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
platform = "linux"
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
